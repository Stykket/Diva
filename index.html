<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DIVA — искусство сна</title>
<meta name="description" content="DIVA. Постельное бельё 300 TC. Чёрный сатин. Ничего лишнего.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Manrope:wght@200;300;400&display=swap" rel="stylesheet">
<style>
  :root{
    --black:#050505; --white:#f4f1ea;
    --dim:rgba(244,241,234,.45);
    --line:rgba(244,241,234,.14);
    --gold:#b39066;
    --serif:'Cormorant Garamond',serif;
    --sans:'Manrope',sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{background:var(--black);color:var(--white);font-family:var(--sans);font-weight:300;-webkit-font-smoothing:antialiased}
  ::selection{background:var(--gold);color:#000}
  img{display:block}
  a{color:inherit;text-decoration:none}
  .micro{font-size:11px;letter-spacing:.38em;text-transform:uppercase;color:var(--dim);font-weight:300}
  .wrap{max-width:1400px;margin:0 auto;padding:0 5vw}

  /* ---------- LOADER ---------- */
  #loader{position:fixed;inset:0;background:#000;z-index:100;display:flex;align-items:center;justify-content:center}
  #loader span{font-family:var(--serif);font-size:26px;letter-spacing:.55em;color:var(--white);opacity:0;animation:lin 1.4s ease forwards}
  #loader span:nth-child(2){animation-delay:.12s}#loader span:nth-child(3){animation-delay:.24s}#loader span:nth-child(4){animation-delay:.36s}
  @keyframes lin{to{opacity:1}}

  /* ---------- CURSOR ---------- */
  #cursor{position:fixed;left:0;top:0;width:8px;height:8px;margin:-4px 0 0 -4px;border-radius:50%;background:#fff;mix-blend-mode:difference;pointer-events:none;z-index:99;display:none}
  @media(pointer:fine){#cursor{display:block}}

  /* ---------- HEADER ---------- */
  header{position:fixed;top:0;left:0;right:0;z-index:50;display:flex;justify-content:space-between;align-items:center;padding:26px 5vw;mix-blend-mode:difference}
  .logo{font-family:var(--serif);font-size:18px;letter-spacing:.55em;color:#fff}
  .head-links{display:flex;gap:38px}
  .head-links a{font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:rgba(255,255,255,.6);transition:color .3s}
  .head-links a:hover{color:#fff}
  @media(max-width:640px){.head-links a:first-child{display:none}}

  /* ---------- HERO ---------- */
  .hero{position:relative;height:100svh;min-height:640px;overflow:hidden;display:flex;align-items:flex-end}
  .hero-bg{position:absolute;inset:-6%;background:#0a0a0a url('https://images.unsplash.com/photo-1578683010236-d716f9a3f461?q=80&w=2400&auto=format&fit=crop') center/cover no-repeat;filter:brightness(.5) contrast(1.08) saturate(.85)} /* ← ЗАМЕНИТЕ НА ВАШЕ AI-ФОТО */
  .hero::after{content:'';position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.85),transparent 45%),radial-gradient(120% 90% at 50% 10%,transparent 40%,rgba(0,0,0,.55))}
  .hero-content{position:relative;z-index:2;padding:0 5vw 12vh;width:100%}
  .hero .micro{display:block;margin-bottom:26px}
  h1{font-family:var(--serif);font-weight:300;font-size:clamp(52px,10vw,150px);line-height:.98;letter-spacing:.01em}
  h1 em{font-style:italic;color:var(--gold)}
  .line{overflow:hidden;display:block}
  .line-inner{display:block;will-change:transform}
  .scroll-hint{position:absolute;left:50%;bottom:0;z-index:3;width:1px;height:72px;background:var(--line);overflow:hidden}
  .scroll-hint::after{content:'';position:absolute;inset:0;background:var(--white);transform:translateY(-100%);animation:drop 2.2s cubic-bezier(.76,0,.24,1) infinite}
  @keyframes drop{40%{transform:translateY(0)}100%{transform:translateY(100%)}}

  /* ---------- STATEMENT ---------- */
  .statement{padding:24vh 0}
  .statement .big{font-family:var(--serif);font-weight:300;font-size:clamp(38px,7.4vw,104px);line-height:1.08}
  .statement .big em{font-style:italic;color:var(--dim)}

  /* ---------- PARALLAX PHOTO ---------- */
  .ph-wrap{position:relative;height:112vh;overflow:hidden}
  .ph{position:absolute;inset:-12% 0;background:#0a0a0a url('https://images.unsplash.com/photo-1631049307264-da0ec9d70304?q=80&w=2200&auto=format&fit=crop') center/cover no-repeat;filter:brightness(.62) contrast(1.05) saturate(.8)} /* ← ФОТО ТКАНИ */
  .ph-caption{position:absolute;left:5vw;bottom:6vh;z-index:2}

  /* ---------- FACTS ---------- */
  .facts{display:flex;justify-content:center;gap:9vw;flex-wrap:wrap;padding:20vh 5vw;text-align:center}
  .fact b{display:block;font-family:var(--serif);font-weight:300;font-size:clamp(44px,6vw,84px);margin-bottom:14px}
  .fact b i{font-style:italic;color:var(--gold)}

  /* ---------- CTA ---------- */
  .cta{padding:16vh 5vw 20vh;text-align:center}
  .cta h2{font-family:var(--serif);font-weight:300;font-style:italic;font-size:clamp(34px,5.6vw,72px);margin-bottom:48px}
  .btn{display:inline-block;padding:18px 52px;border:1px solid var(--line);border-radius:100px;font-size:11px;letter-spacing:.34em;text-transform:uppercase;color:var(--white);transition:.4s}
  .btn:hover{background:var(--white);color:#000;border-color:var(--white)}

  footer{border-top:1px solid var(--line);padding:52px 5vw;display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;align-items:center}
  footer a{transition:color .3s}footer a:hover{color:var(--white)}

  html.lenis,html.lenis body{height:auto}
  .lenis.lenis-smooth{scroll-behavior:auto!important}
</style>
</head>
<body>

<div id="loader"><span>D</span><span>I</span><span>V</span><span>A</span></div>
<div id="cursor"></div>

<!-- COMPONENT: Header -->
<header>
  <a class="logo" href="#">DIVA</a>
  <nav class="head-links">
    <a href="#collection">Коллекция</a>
    <a href="https://wa.me/79236316136" target="_blank">Связаться</a>
  </nav>
</header>

<!-- COMPONENT: Hero -->
<section class="hero">
  <div class="hero-bg" id="heroBg"></div>
  <div class="hero-content">
    <span class="micro">DIVA · 300 TC · Хлопок</span>
    <h1>
      <span class="line"><span class="line-inner">Искусство</span></span>
      <span class="line"><span class="line-inner"><em>тишины</em></span></span>
    </h1>
  </div>
  <div class="scroll-hint"></div>
</section>

<!-- COMPONENT: Statement -->
<section class="statement">
  <div class="wrap">
    <div class="big">
      <span class="line"><span class="line-inner">300 нитей на дюйм².</span></span>
      <span class="line"><span class="line-inner"><em>Хлопок.</em></span></span>
      <span class="line"><span class="line-inner">Ничего лишнего.</span></span>
    </div>
  </div>
</section>

<!-- COMPONENT: Parallax photo -->
<section class="ph-wrap">
  <div class="ph" data-parallax></div>
  <div class="ph-caption micro">Сатин. Глубина чёрного.</div>
</section>

<!-- COMPONENT: Facts -->
<section class="facts">
  <div class="fact" data-reveal><b>300<i>TC</i></b><span class="micro">Плотность</span></div>
  <div class="fact" data-reveal><b>100<i>%</i></b><span class="micro">Хлопок</span></div>
  <div class="fact" data-reveal><b>6</b><span class="micro">Оттенков</span></div>
</section>

<!-- COMPONENT: CTA -->
<section class="cta" id="collection">
  <h2 data-reveal>Коллекция скоро.</h2>
  <a class="btn" data-reveal href="https://wa.me/79236316136?text=%D0%97%D0%B4%D1%80%D0%B0%D0%B2%D1%81%D1%82%D0%B2%D1%83%D0%B9%D1%82%D0%B5!%20%D0%A5%D0%BE%D1%87%D1%83%20%D1%83%D0%B7%D0%BD%D0%B0%D1%82%D1%8C%20%D0%BE%20%D1%81%D1%82%D0%B0%D1%80%D1%82%D0%B5%20%D0%BA%D0%BE%D0%BB%D0%BB%D0%B5%D0%BA%D1%86%D0%B8%D0%B8%20DIVA." target="_blank">Стать первым</a>
</section>

<!-- COMPONENT: Footer -->
<footer>
  <span class="micro">© 2026 DIVA</span>
  <span class="micro"><a href="https://wa.me/79236316136" target="_blank">WhatsApp</a> &nbsp;·&nbsp; <a href="https://t.me/Stykket" target="_blank">Telegram</a> &nbsp;·&nbsp; <a href="tel:+79236316136">+7 923 631-61-36</a></span>
</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script src="https://unpkg.com/lenis@1/dist/lenis.min.js"></script>
<script>
gsap.registerPlugin(ScrollTrigger);

/* ---------- Lenis smooth scroll + синхронизация с GSAP ---------- */
if(window.Lenis){
  const lenis = new Lenis({ lerp:.09, smoothWheel:true });
  lenis.on('scroll', ScrollTrigger.update);
  gsap.ticker.add(t => lenis.raf(t*1000));
  gsap.ticker.lagSmoothing(0);
}

/* ---------- Loader + hero reveal ---------- */
window.addEventListener('load', () => {
  const tl = gsap.timeline({ defaults:{ ease:'power4.out' } });
  tl.to('#loader', { autoAlpha:0, duration:.9, delay:.7, ease:'power2.inOut' })
    .from('.hero .line-inner', { yPercent:115, duration:1.4, stagger:.14 }, '-=.25')
    .from('.hero .micro', { autoAlpha:0, y:24, duration:1 }, '-=.9')
    .from('.scroll-hint', { autoAlpha:0, duration:1 }, '-=.7');

  /* Ken Burns: медленное дыхание фото */
  gsap.fromTo('#heroBg', { scale:1.15 }, { scale:1.02, duration:3.2, ease:'power2.out', delay:.8 });
  gsap.to('#heroBg', { scale:1.1, duration:16, ease:'sine.inOut', yoyo:true, repeat:-1, delay:4 });
});

/* ---------- Statement: построчный reveal при скролле ---------- */
gsap.from('.statement .line-inner', {
  yPercent:115, duration:1.3, stagger:.16, ease:'power4.out',
  scrollTrigger:{ trigger:'.statement', start:'top 72%' }
});

/* ---------- Parallax фото ---------- */
gsap.utils.toArray('[data-parallax]').forEach(el => {
  gsap.fromTo(el, { yPercent:-10 }, {
    yPercent:10, ease:'none',
    scrollTrigger:{ trigger:el.parentElement, start:'top bottom', end:'bottom top', scrub:true }
  });
});

/* ---------- Fade-reveal для мелких элементов ---------- */
gsap.utils.toArray('[data-reveal]').forEach(el => {
  gsap.from(el, {
    y:44, autoAlpha:0, duration:1.2, ease:'power3.out',
    scrollTrigger:{ trigger:el, start:'top 88%' }
  });
});

/* ---------- Кастомный курсор (только десктоп) ---------- */
if(matchMedia('(pointer:fine)').matches){
  const cx = gsap.quickTo('#cursor','x',{ duration:.55, ease:'power3' });
  const cy = gsap.quickTo('#cursor','y',{ duration:.55, ease:'power3' });
  addEventListener('pointermove', e => { cx(e.clientX); cy(e.clientY); });
}
</script>
</body>
</html>
